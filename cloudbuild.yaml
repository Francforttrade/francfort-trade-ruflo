steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/ruflo:$SHORT_SHA', '.']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/ruflo:$SHORT_SHA']

  # Secret names below match docs/ROADMAP.md's Secret Manager checklist.
  # Create them once with `gcloud secrets create <name>` before the first
  # deploy — see DEPLOY.md.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ruflo
      - --image=gcr.io/$PROJECT_ID/ruflo:$SHORT_SHA
      - --region=southamerica-east1
      - --platform=managed
      - --no-allow-unauthenticated
      - --set-env-vars=NODE_ENV=production,GCP_PROJECT_ID=$PROJECT_ID
      - --set-secrets=ANTHROPIC_API_KEY=francfort-anthropic-api-key:latest,SUPABASE_URL=francfort-supabase-url:latest,SUPABASE_KEY=francfort-supabase-key:latest,SUPABASE_SERVICE_KEY=francfort-supabase-service-key:latest,WHATSAPP_API_KEY=francfort-whatsapp-webhook-secret:latest

images:
  - 'gcr.io/$PROJECT_ID/ruflo:$SHORT_SHA'
